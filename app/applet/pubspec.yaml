name: pragati_agrikite
description: "PRAGATI - Strengthening Market Linkages and AI Price Discovery for Farmers (Smart India Hackathon)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.2

  # Networking & Serialization
  http: ^1.2.1
  dio: ^5.4.3+1

  # Local Storage & Caching
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Camera & Image Handling
  camera: ^0.10.5+9
  image_picker: ^1.1.0
  image: ^4.2.0

  # UI, Icons, Typography & Charts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
